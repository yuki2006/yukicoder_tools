[package]
name = "yukicoder-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "CI/CD from a Git repository to yukicoder: sync problem settings, statement, test cases, generator and editorial through the public API"
license = "Apache-2.0"
readme = "README.md"
keywords = ["yukicoder", "competitive-programming", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "yuki"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "0.8"

[profile.release]
strip = true
